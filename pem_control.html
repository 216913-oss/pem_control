<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>PEM Electrolyser System Control</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center; /* Center everything */
        }

        h2 {
            color: #0077b6;
            margin-bottom: 30px;
        }

        .control-group {
            margin-bottom: 25px;
        }

        .control-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 15px;
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Darken effect when pressed */
        button:active {
            filter: brightness(0.8);
        }

        /* Button Colors */
        .on-btn {
            background-color: #38b000;
            color: white;
        }

        .off-btn {
            background-color: #d00000;
            color: white;
        }

        /* Slider Styles */
        .slider-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        input[type="range"] {
            width: 60%;
        }

        #sliderValue {
            min-width: 30px;
            text-align: right;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>PEM Electrolyser System Control</h2>

        <!-- Stack Power of Electrolyser -->
        <div class="control-group">
            <label>Stack Power of Electrolyser</label>
            <button class="on-btn" onclick="sendData('stackPower',1)">ON</button>
            <button class="off-btn" onclick="sendData('stackPower',0)">OFF</button>
        </div>

        <!-- Water Feeding Pump -->
        <div class="control-group">
            <label>Water Feeding Pump</label>
            <button class="on-btn" onclick="sendData('waterPump',1)">ON</button>
            <button class="off-btn" onclick="sendData('waterPump',0)">OFF</button>
        </div>

        <!-- Make Up Water Pump -->
        <div class="control-group">
            <label>Make Up Water Pump</label>
            <button class="on-btn" onclick="sendData('makeupPump',1)">ON</button>
            <button class="off-btn" onclick="sendData('makeupPump',0)">OFF</button>
        </div>

        <!-- MOSFET Control Slider -->
        <div class="control-group">
            <label>MOSFET PWM Control (0 to 1)</label>
            <div class="slider-container">
                <input type="range" id="mosfetSlider" min="0" max="1" step="0.01" value="0" oninput="sendData('mosfet', this.value)">
                <span id="sliderValue">0</span>
            </div>
        </div>
    </div>

    <script>
        const writeKey = "JQ8DUZO7B49QEO86";

        function sendData(control, value){
            if(control === 'mosfet') {
                document.getElementById('sliderValue').innerText = value;
            }

            let field = 1;
            if(control === 'stackPower') field = 1;
            else if(control === 'waterPump') field = 2;
            else if(control === 'makeupPump') field = 3;
            else if(control === 'mosfet') field = 4;

            fetch(`https://api.thingspeak.com/update?api_key=${writeKey}&field${field}=${value}`)
                .then(response => response.text())
                .then(data => console.log(control + " sent:", data))
                .catch(err => console.error(err));
        }
    </script>
</body>
</html>
