name: 5-Min Predict
on:
  schedule: [{cron: "*/5 * * * *"}]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Downloads full history so rebase can succeed

      - name: Download Model from Training Workflow
        uses: dawidd6/action-download-artifact@v8
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: train.yml 
          name: model-files 
          latest_status: completed

      - uses: actions/setup-python@v5
        with: {python-version: '3.10'}

      - run: pip install -r requirements.txt

      - name: Run Prediction Script
        env:
          THINGSPEAK_KEY: ${{ secrets.THINGSPEAK_KEY }}
        run: python predict.py

      - name: Commit and Push Forecast
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 1. Add the file
          git add forecast.csv
          
          # 2. Commit only if there's a change
          git commit -m "Update electrolyzer forecast [1-month]" || exit 0
          
          # 3. Fetch and Rebase (This is the critical part)
          git fetch origin main
          git rebase origin/main
          
          # 4. Push
          git push origin main
