<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PEM Electrolyser Control Panel</title>

<style>
:root {
    --bg-dark: #0b1329;
    --card-bg: rgba(30, 41, 59, 0.7);
    --primary-cyan: #38bdf8;
    --primary-cyan-hover: #0ea5e9;
    --success-green: #22c55e;
    --danger-red: #ef4444;
    --text-slate: #cbd5e1;
}

body {
    margin: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, var(--bg-dark), #111827);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: white;
}

.container {
    width: 500px;
    padding: 30px;
    border-radius: 24px;
    background: var(--card-bg);
    box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.1);
}

h2 {
    text-align: center;
    color: var(--primary-cyan);
    margin-top: 0;
    margin-bottom: 25px;
    font-weight: 600;
    letter-spacing: 0.5px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    padding-bottom: 15px;
}

.control-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 20px;
}

.section {
    background: rgba(15, 23, 42, 0.4);
    padding: 15px;
    border-radius: 14px;
    border: 1px solid rgba(255, 255, 255, 0.03);
}

.btn-group-layout {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

label {
    font-size: 0.95rem;
    color: var(--text-slate);
    font-weight: 500;
}

.btn-wrapper {
    display: flex;
    gap: 8px;
}

.btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.05);
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    transition: all 0.2s ease-in-out;
    background: #334155;
    color: var(--text-slate);
}

.active-on {
    background: var(--success-green) !important;
    color: #052e16 !important;
    box-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
}

.active-off {
    background: var(--danger-red) !important;
    color: white !important;
    box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);
}

.slider-container {
    margin-top: 10px;
}

.slider {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    height: 6px;
    border-radius: 5px;
    background: #475569;
    outline: none;
}

.slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--primary-cyan);
    cursor: pointer;
    box-shadow: 0 0 8px var(--primary-cyan);
}

.slider:disabled {
    opacity: 0.3;
}

.value {
    text-align: right;
    font-size: 1.1rem;
    color: var(--primary-cyan);
    font-weight: 700;
    font-family: monospace;
}

.submit {
    width: 100%;
    margin-top: 15px;
    padding: 14px;
    background: var(--primary-cyan);
    border-radius: 12px;
    font-weight: 700;
    font-size: 1rem;
    cursor: pointer;
    color: #0f172a;
    border: none;
}
</style>
</head>

<body>

<div class="container">
    <h2>PEM Electrolyser Control Panel</h2>

    <div class="control-grid">

        <div class="section btn-group-layout">
            <label>System Power</label>
            <div class="btn-wrapper">
                <button id="powerOn" class="btn" onclick="toggleControl('power',1,'powerOn','powerOff')">ON</button>
                <button id="powerOff" class="btn" onclick="toggleControl('power',0,'powerOn','powerOff')">OFF</button>
            </div>
        </div>

        <div class="section">
            <div style="display:flex;justify-content:space-between;">
                <label>Stack Current Setpoint (0–8 A)</label>
                <div class="value" id="currentValue">0.0 A</div>
            </div>
            <input id="currentSlider" type="range" min="0" max="8" step="0.1"
                value="0" class="slider" oninput="updateCurrent(this.value)">
        </div>

        <div class="section btn-group-layout">
            <label>Water Feeding Pump</label>
            <div class="btn-wrapper">
                <button id="pumpOn" class="btn" onclick="toggleControl('pump',1,'pumpOn','pumpOff')">ON</button>
                <button id="pumpOff" class="btn" onclick="toggleControl('pump',0,'pumpOn','pumpOff')">OFF</button>
            </div>
        </div>

        <div class="section btn-group-layout">
            <label>Running Mode</label>
            <div class="btn-wrapper">
                <button id="modeAuto" class="btn" onclick="toggleControl('runningMode',1,'modeAuto','modeManual')">Auto</button>
                <button id="modeManual" class="btn" onclick="toggleControl('runningMode',0,'modeAuto','modeManual')">Manual</button>
            </div>
        </div>

        <div class="section btn-group-layout">
            <label>Water Filling Pump</label>
            <div class="btn-wrapper">
                <button id="fillOn" class="btn" onclick="toggleControl('filling',1,'fillOn','fillOff')">ON</button>
                <button id="fillOff" class="btn" onclick="toggleControl('filling',0,'fillOn','fillOff')">OFF</button>
            </div>
        </div>

        <button class="submit" onclick="sendData()">TRANSMIT PARAMETERS</button>
    </div>
</div>

<script>
const API_KEY = "JQ8DUZO7B49QEO86";

let data = {
    power: 0,
    current: 0,
    pump: 0,
    runningMode: 0,
    filling: 0
};

// FIX 1: prevent spam (ThingSpeak 15s rule)
let lastSendTime = 0;

document.addEventListener("DOMContentLoaded", () => {
    toggleControl('power', 0, 'powerOn', 'powerOff');
    toggleControl('pump', 0, 'pumpOn', 'pumpOff');
    toggleControl('runningMode', 0, 'modeAuto', 'modeManual');
    toggleControl('filling', 0, 'fillOn', 'fillOff');
});

function toggleControl(key, value, onId, offId) {
    data[key] = value;

    const onBtn = document.getElementById(onId);
    const offBtn = document.getElementById(offId);
    const slider = document.getElementById("currentSlider");

    if (value === 1) {
        onBtn.classList.add("active-on");
        offBtn.classList.remove("active-off");
    } else {
        offBtn.classList.add("active-off");
        onBtn.classList.remove("active-on");
    }

    if (key === 'power') {
        if (value === 0) {
            slider.value = 0;
            slider.disabled = true;
            updateCurrent(0);
        } else {
            slider.disabled = false;
        }
    }
}

function updateCurrent(value) {
    data.current = value;
    document.getElementById("currentValue").innerText =
        parseFloat(value).toFixed(1) + " A";
}

function sendData() {

    // FIX 2: enforce 15s rule
    const now = Date.now();
    if (now - lastSendTime < 16000) {
        alert("Please wait 15–16 seconds between transmissions (ThingSpeak limit).");
        return;
    }
    lastSendTime = now;

    const url =
        `https://api.thingspeak.com/update?api_key=${API_KEY}` +
        `&field1=${data.power}` +
        `&field2=${data.current}` +
        `&field3=${data.pump}` +
        `&field4=${data.runningMode}` +
        `&field5=${data.filling}`;

    console.log("Sending:", url);

    fetch(url)
    .then(res => res.text())
    .then(id => {
        console.log("Response:", id);

        if (id === "0") {
            alert("Rejected by ThingSpeak (rate limit or API issue). Wait 15 seconds.");
        } else {
            alert("Success! Entry ID: " + id);
        }
    })
    .catch(err => {
        console.log(err);
        alert("Network error or blocked request.");
    });
}
</script>

</body>
</html>
